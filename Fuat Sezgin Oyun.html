<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuat Sezgin - LEGENDARY EDITION</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;overflow:hidden}
.screen{display:none;justify-content:center;align-items:center;flex-direction:column;height:100vh;text-align:center;animation:fade 0.6s}
.active{display:flex}
@keyframes fade{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
h1{font-size:42px;margin-bottom:20px;letter-spacing:1px}
button{padding:14px 28px;border:none;border-radius:30px;font-size:18px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#ff8a00,#e52e71);color:white;margin:10px;transition:0.3s}
button:hover{transform:scale(1.1)}
.resetBtn{background:linear-gradient(90deg,#616161,#9e9e9e)}
input{padding:12px 18px;border-radius:25px;border:none;margin-top:10px;font-size:16px}
.topbar{display:flex;justify-content:space-between;padding:12px 40px;font-weight:600;font-size:18px}
.progress{height:14px;background:#222;border-radius:20px;overflow:hidden;margin:0 40px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00f260,#0575e6);transition:0.3s}
.game{display:flex;justify-content:space-between;padding:20px 40px;gap:30px;height:65vh}
.column{width:48%;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.card{padding:14px;border-radius:14px;background:rgba(255,255,255,0.08);cursor:pointer;transition:0.25s;font-weight:600}
.card:hover{background:rgba(255,255,255,0.2);transform:scale(1.05)}
.selected{outline:3px solid #00e5ff;box-shadow:0 0 15px #00e5ff}
.correct{background:#00c853;box-shadow:0 0 15px #00ff95}
.wrong{background:#d50000;animation:shake 0.3s}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}100%{transform:translateX(0)}}
.leaderboard{margin-top:20px;font-size:18px;max-height:200px;overflow:auto}
footer{position:absolute;bottom:10px;width:100%;text-align:center;opacity:0.6;font-size:14px}
</style>
</head>
<body>

<div id="menu" class="screen active">
<h1>🏆 FUAT SEZGİN<br>LEGENDARY CLASSROOM EDITION</h1>
<input type="text" id="playerName" placeholder="Adını yaz ve başla">
<div>
<button onclick="startGame(90)">Kolay(90Sn)</button>
<button onclick="startGame(60)">Zor(60Sn)</button>
<button onclick="startGame(40)">Hardcore(40Sn)</button>
</div>
<button class="resetBtn" onclick="clearScores()">Skorları Sıfırla</button>
<div class="leaderboard" id="leaderboard"></div>
<footer>PRODUCED BY KEMAL EFE YILMAZ</footer>
</div>

<div id="gameScreen" class="screen">
<div class="topbar">
<div>Oyuncu: <span id="player"></span></div>
<div>Süre: <span id="timer"></span></div>
<div>Skor: <span id="score">0</span>/20</div>
</div>
<div class="progress"><div class="progress-bar" id="progress"></div></div>
<div class="game">
<div class="column" id="questions"></div>
<div class="column" id="answers"></div>
</div>
<button onclick="goMenu()">Menüye Dön</button>
</div>

<script>
const baseData=[["1924 doğum","Fuat Sezgin"],["En büyük eser","GAS"],["1978 ödülü","Kral Faysal"],["27 dil","Çok dillilik"],["Frankfurt enstitüsü","İslam Bilimleri Tarihi"],["İstanbul müzesi","İslam Bilim ve Teknoloji"],["Vefat","2018"],["Rönesans görüşü","İslam etkisi"],["Doktora","Buhari"],["Çalışma süresi","17 saat"],["1960","Almanya"],["Profesörlük","Frankfurt"],["Alan","Bilim Tarihi"],["Araştırma","Yazma eser"],["Rekonstrüksiyon","Bilimsel alet"],["Ödül","Cumhurbaşkanlığı"],["Hocası","Hellmut Ritter"],["Park","Gülhane"],["Yaklaşım","Belgeye dayalı"],["Motto","Çalışmak"]];

let data=[],score=0,time=60,timerInterval,selected=null,player="";

function startGame(duration){player=document.getElementById('playerName').value||"Misafir";document.getElementById('player').textContent=player;time=duration;score=0;document.getElementById('score').textContent=0;document.getElementById('progress').style.width='0%';document.getElementById('menu').classList.remove('active');document.getElementById('gameScreen').classList.add('active');data=[...baseData].sort(()=>Math.random()-0.5);loadGame();startTimer();}

function loadGame(){const q=document.getElementById('questions');const a=document.getElementById('answers');q.innerHTML='';a.innerHTML='';let shuffledA=[...data].sort(()=>Math.random()-0.5);data.forEach(item=>{let d=document.createElement('div');d.className='card';d.textContent=item[0];d.onclick=()=>selectCard(d,item[1]);q.appendChild(d);});shuffledA.forEach(item=>{let d=document.createElement('div');d.className='card';d.textContent=item[1];d.onclick=()=>match(d,item[1]);a.appendChild(d);});}

function selectCard(el,ans){if(selected)selected.classList.remove('selected');selected=el;el.dataset.answer=ans;el.classList.add('selected');}

function match(el,ans){if(!selected)return;if(selected.dataset.answer===ans){el.classList.add('correct');selected.classList.add('correct');score++;updateProgress();}else el.classList.add('wrong');document.getElementById('score').textContent=score;selected.classList.remove('selected');selected=null;if(score===20)endGame(true);} 

function startTimer(){document.getElementById('timer').textContent=time;timerInterval=setInterval(()=>{time--;document.getElementById('timer').textContent=time;if(time<=0)endGame(false)},1000);} 

function updateProgress(){document.getElementById('progress').style.width=(score/20*100)+'%'}

function endGame(win){clearInterval(timerInterval);saveScore();setTimeout(()=>{alert(win?"🏆 EFSANE PERFORMANS! TAM SKOR!":"Süre doldu!");goMenu();},300);} 

function goMenu(){document.getElementById('gameScreen').classList.remove('active');document.getElementById('menu').classList.add('active');loadLeaderboard();}

function saveScore(){let scores=JSON.parse(localStorage.getItem('fs_scores')||"[]");scores.push({name:player,score:score});scores.sort((a,b)=>b.score-a.score);localStorage.setItem('fs_scores',JSON.stringify(scores.slice(0,5)));}

function loadLeaderboard(){let scores=JSON.parse(localStorage.getItem('fs_scores')||"[]");let lb=document.getElementById('leaderboard');lb.innerHTML="<h3>🏅 Liderlik Tablosu</h3>";scores.forEach(s=>lb.innerHTML+=`${s.name}: ${s.score}/20<br>`);} 

function clearScores(){if(confirm('Tüm skorlar silinsin mi?')){localStorage.removeItem('fs_scores');loadLeaderboard();}}

loadLeaderboard();
</script>
</body>
</html>
