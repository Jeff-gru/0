<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuat Sezgin Bilgi Oyunu</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
.container{width:95%;max-width:1000px;text-align:center}

h1{margin-bottom:25px;font-size:36px}

#timer{
font-size:22px;
margin-bottom:15px;
font-weight:bold;
color:#00e5ff;
}

input{
padding:14px;
width:260px;
border:none;
border-radius:10px;
font-size:16px;
margin-bottom:20px;
outline:none;
}

button{
padding:14px 30px;
border:none;
border-radius:12px;
background:#00e5ff;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}
button:hover{transform:scale(1.08);background:#00c4db}

.game{
margin-top:20px;
display:flex;
flex-direction:column;
gap:20px;
}

.questionCard{
background:rgba(255,255,255,0.1);
padding:18px;
border-radius:12px;
}

.answers{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:10px;
}

.option{
background:#1f2a3a;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.option:hover{background:#00e5ff;color:#000}

.correct{background:#00c853!important}
.wrong{background:#c62828!important}
.locked{opacity:0.4;pointer-events:none}

.scoreboard{
margin-top:30px;
background:rgba(0,0,0,.4);
padding:25px;
border-radius:15px;
font-size:18px;
}
.scoreboard h2{margin-bottom:15px;font-size:26px}
.scoreboard ul{
list-style:none;
max-height:250px;
overflow-y:auto;
text-align:left;
}
.scoreboard li{
padding:7px 0;
border-bottom:1px solid rgba(255,255,255,.2);
}

.hide{display:none}
</style>
</head>

<body>

<div class="container">

<div id="menu">
<h1>Fuat Sezgin Boşluk Doldurma Oyunu</h1>
<input type="text" id="playerName" placeholder="Adınızı girin">
<br>
<button onclick="startGame()">Başla</button>

<div class="scoreboard">
<h2>Skor Tablosu</h2>
<ul id="scoreList"></ul>
</div>
</div>

<div id="gameArea" class="hide">
<h1 id="timer">Süre: 50</h1>
<div class="game" id="game"></div>
</div>

</div>

<script>

const questions = [
["Fuat Sezgin 1924 yılında ______ doğmuştur.","Bitlis'te"],
["Fuat Sezgin'in doğum yılı","1924"],
["Fuat Sezgin'in vefat yılı","2018"],
["Fuat Sezgin'in mezarı","İstanbul"],
["Hayatının büyük kısmını geçirdiği ülke","Almanya"],
["Kurduğu enstitü","İslam Bilim Tarihi Enstitüsü"],
["En önemli eseri","Arap-İslam Bilim Tarihi"],
["İstanbul Üniversitesi'nde okuduğu bölüm","Arap Dili ve Edebiyatı"],
["Kaç dil biliyordu","27"],
["Frankfurt'ta çalıştığı üniversite","Frankfurt Üniversitesi"],
["Bilim insanlarının icatlarını","Belgelemiştir"],
["Hayatını adadığı alan","Bilim Tarihi"],
["Çalışmalarının odak noktası","İslam Bilimi"],
["Cumhurbaşkanlığı ödülü aldığı yıl","2015"],
["Almanya'ya gidiş sebebi","1960 darbesi"],
["Türkiye'de adına kurulan yapı","Müze"],
["Bilim tarihi yaklaşımı","İslam merkezli"],
["Yeniden yaptığı aletler","Bilimsel Aletler"],
["Genç yaşta öğrendiği diller","Doğu dilleri"],
["Bilim insanlarını","Araştırmıştır"],
["Eserinin dili","Almanca"],
["Frankfurt'taki müze adı","İslam Bilim Tarihi Müzesi"],
["Yaşam süresi","94 yıl"],
["İlk akademik çalışmaları","Hadis"],
["Bilim tarihine bakışı","Objektif"],
["Çalışma disiplini","Yoğun"],
["Günde ortalama çalışma saati","17"],
["İslam medeniyetinin","Katkısını göstermiştir"],
["Yurt dışında en çok bulunduğu şehir","Frankfurt"],
["Akademik unvanı","Profesör"],
["En büyük hedefi","Önyargıları kırmak"],
["Bilime katkısı","Kaynak araştırma"],
["Eser sayısı","Ciltli seri"],
["Bilim tarihi alanındaki saygınlığı","Uluslararası"],
["Çalışma yöntemi","Arşiv inceleme"],
["Hayat felsefesi","Azim"],
["Araştırma yaptığı alanlar","Astronomi"],
["Araştırma yaptığı alan","Tıp"],
["Araştırma yaptığı alan","Matematik"],
["Araştırma yaptığı alan","Coğrafya"],
["Arap bilim insanlarını","Tanıtmıştır"],
["İslam bilimini","Ön plana çıkarmıştır"],
["Bilimsel ahlakı","Titizlik"],
["Ders verdiği yer","Üniversite"],
["Bilimi","Evrensel görmüştür"],
["Kütüphane çalışmaları","Yoğundu"],
["Enstitü kuruluş yılı","1982"],
["Almanya'ya yerleştiği yıl","1961"],
["Doğduğu bölge","Doğu Anadolu"],
["Bilimsel yaklaşımı","Disiplinli"],
["Bilim tarihindeki rolü","Öncü"],
["Bilim insanlarına bakışı","Saygılı"],
["Öğrencilerine verdiği öğüt","Çalışkan olun"],
["Araştırmalarının temeli","Yazmalar"],
["Osmanlıca biliyor muydu","Evet"],
["İslam biliminin Avrupa'ya etkisi","Büyüktür"],
["Bilimde süreklilik anlayışı","Savundu"],
["Batı merkezli bakışı","Eleştirdi"],
["Bilimsel verileri","Topladı"],
["Tarihi belgeleri","İnceledi"],
["Akademik kariyerine başladığı yer","Türkiye"],
["Uluslararası tanınırlığı","Yüksek"],
["Bilimsel mirası","Kalıcı"],
["Adına verilen yıl","2019 Fuat Sezgin Yılı"],
["Yaşam amacı","Bilime hizmet"],
["Müzede sergilenenler","Replikalar"],
["Yurtdışında sürdürdüğü görev","Akademisyen"],
["Bilim tarihi alanındaki misyonu","Doğruluk"],
["Bilime yaklaşımı","Objektif"],
["En çok incelediği kaynaklar","Arapça yazmalar"],
["Bilimin kaynağı olarak gördüğü medeniyet","İslam"],
["Almanya'da aldığı destek","Akademik"],
["Türkiye'ye katkısı","Farkındalık"],
["Bilime bakışı","Evrensel"],
["Bilimde temel değer","Çalışkanlık"],
["Gençlere mesajı","Vazgeçmeyin"],
["Bilimsel üretimi","Yoğun"],
["Tüm hayatı boyunca yaptığı şey","Araştırmak"],
["Bilim dünyasına etkisi","Büyük"]
];

let gameQuestions = [];
let score = 0;
let player = "";
let time = 50;
let timerInterval = null;

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

function startGame(){
    player = document.getElementById("playerName").value.trim();
    if(!player){ alert("İsim gir"); return; }

    score = 0;
    time = 50;
    document.getElementById("timer").textContent = "Süre: " + time;

    gameQuestions = shuffle([...questions]); // tüm havuz karışır
    gameQuestions = gameQuestions.slice(0,20); // her oyun 20 farklı soru

    document.getElementById("menu").classList.add("hide");
    document.getElementById("gameArea").classList.remove("hide");

    startTimer();
    loadGame();
}

function startTimer(){
    clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
        time--;
        document.getElementById("timer").textContent = "Süre: " + time;
        if(time <= 0){
            clearInterval(timerInterval);
            finishGame();
        }
    },1000);
}

function loadGame(){
    const area=document.getElementById("game");
    area.innerHTML="";

    gameQuestions.forEach(q=>{
        let card=document.createElement("div");
        card.className="questionCard";

        let question=document.createElement("div");
        question.textContent=q[0];
        card.appendChild(question);

        let ans=document.createElement("div");
        ans.className="answers";

        let options = shuffle(gameQuestions.map(item=>item[1]));

        options.forEach(opt=>{
            let btn=document.createElement("div");
            btn.className="option";
            btn.textContent=opt;
            btn.onclick=()=>check(btn,q[1],card);
            ans.appendChild(btn);
        });

        card.appendChild(ans);
        area.appendChild(card);
    });
}

function check(btn,correct,card){
    if(card.classList.contains("locked")) return;

    if(btn.textContent===correct){
        btn.classList.add("correct");
        score++;
    }else{
        btn.classList.add("wrong");
    }
    card.classList.add("locked");
}

function finishGame(){
    clearInterval(timerInterval);
    saveScore();
    setTimeout(()=>{
        document.getElementById("gameArea").classList.add("hide");
        document.getElementById("menu").classList.remove("hide");
    },800);
}

function saveScore(){
    let scores=JSON.parse(localStorage.getItem("fs_scores")||"[]");

    if(scores.some(s=>s.name===player)){
        player = player+"_"+Math.floor(Math.random()*100);
    }

    scores.push({name:player,score:score});
    scores.sort((a,b)=>b.score-a.score);
    localStorage.setItem("fs_scores",JSON.stringify(scores));
    renderScores();
}

function renderScores(){
    let scores=JSON.parse(localStorage.getItem("fs_scores")||"[]");
    const list=document.getElementById("scoreList");
    list.innerHTML="";
    scores.forEach(s=>{
        let li=document.createElement("li");
        li.textContent=`${s.name} - ${s.score} puan`;
        list.appendChild(li);
    });
}

renderScores();

</script>

</body>
</html>
